name: Cross-platform build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XMAKE_VERSION: '3.1.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: ${{ github.repository == 'TomGatin/Squacaron' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Restore xmake packages cache
        id: packages-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.xmake/packages
            ~\AppData\Local\.xmake\packages
          key: xmake-pkgs-v2-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-pkgs-v2-${{ runner.os }}-

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: build/.build_cache
          key: xmake-build-v1-windows-release-${{ github.sha }}
          restore-keys: |
            xmake-build-v1-windows-release-

      - name: Configure
        run: xmake f -m release --policies=build.ccache:y -y

      - name: Dump xmake package logs
        if: failure()
        shell: bash
        run: |
          for dir in ~/.xmake/cache/packages ~/AppData/Local/.xmake/cache/packages; do
            [ -d "$dir" ] || continue
            find "$dir" -path '*.failed/logs/*.txt' -print0 | while IFS= read -r -d '' log; do
              echo "::group::$log"
              grep -n -m 40 -A 4 -E "error (C|LNK)[0-9]+|FAILED:" "$log" || true
              tail -n 200 "$log"
              echo "::endgroup::"
            done
          done

      - name: Build
        run: xmake build -v -y

      - name: Run tests
        run: xmake test "test_*/*"

      - name: Save xmake packages cache
        if: ${{ github.ref == 'refs/heads/main' && steps.packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.xmake/packages
            ~\AppData\Local\.xmake\packages
          key: ${{ steps.packages-cache.outputs.cache-primary-key }}

      - name: Save build cache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: build/.build_cache
          key: xmake-build-v1-windows-release-${{ github.sha }}

  # ECS core under AddressSanitizer, UndefinedBehaviorSanitizer and Valgrind, plus a short benchmark run (issue #40).
  # Only runs on pushes to main, not on every pull request.
  ecs-memory:
    name: ECS sanitizers, Valgrind and benchmark
    if: ${{ github.repository == 'TomGatin/Squacaron' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      ECS_TESTS: test_ecs test_ecs_stress
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Restore xmake packages cache
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: xmake-pkgs-ecs-v1-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-pkgs-ecs-v1-${{ runner.os }}-

      - name: Run the ECS tests under ASan and UBSan
        run: |
          xmake f -m debug --graphics=n --sanitizers=y -y
          for test in $ECS_TESTS; do
            xmake build -y $test
            xmake run $test
          done

      - name: Run the ECS tests under Valgrind
        run: |
          xmake f -m debug --graphics=n --sanitizers=n -y
          for test in $ECS_TESTS; do
            xmake build -y $test
            valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
              "build/linux/x86_64/debug/$test"
          done

      - name: Run the ECS benchmark once
        run: |
          xmake f -m release --graphics=n --benchmarks=y -y
          xmake build -y bench_ecs
          xmake run bench_ecs --benchmark_min_time=0.01s
