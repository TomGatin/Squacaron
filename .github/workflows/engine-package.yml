name: Engine package

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'xmake-repo/**'
      - 'xmake/**'
      - '**/xmake.lua'
      - '.github/workflows/engine-package.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  XMAKE_VERSION: '3.1.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-package:
    name: Standalone engine + games on the package (ubuntu-latest)
    if: ${{ github.repository == 'TomGatin/Squacaron' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Restore xmake packages cache
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: xmake-pkgs-v2-${{ runner.os }}-${{ hashFiles('xmake.lua', 'engine/xmake.lua') }}
          restore-keys: |
            xmake-pkgs-v2-${{ runner.os }}-

      - name: Build and test the engine alone
        working-directory: engine
        run: |
          xmake f -P . -m release --tests=y -y
          xmake build -P . -y
          xmake test -P .

      - name: Build the games on the squacaron package
        run: |
          xmake f -m release --engine_package=y -y
          xmake require --force -y squacaron
          xmake build -y

      - name: Run the game tests
        run: xmake test "test_*/*"
